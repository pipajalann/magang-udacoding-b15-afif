<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-labelledby="heroSvgTitle">
  <title id="heroSvgTitle">Ilustrasi editor kode dan pratinjau aplikasi web Udacoding Bootcamp Fullstack 12 Minggu</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="8" y="8" width="544" height="404" rx="24" fill="url(#bgGrad)" />
  <circle cx="485" cy="72" r="46" fill="#dbeafe" opacity="0.85" />
  <circle cx="72" cy="356" r="38" fill="#99f6e4" opacity="0.65" />

  <!-- Code Editor Window -->
  <rect x="36" y="42" width="380" height="264" rx="14" fill="#0f172a" />
  <rect x="36" y="42" width="380" height="36" rx="14" fill="#1e293b" />
  <rect x="36" y="64" width="380" height="14" fill="#1e293b" />
  <circle cx="58" cy="60" r="5" fill="#ef4444" />
  <circle cx="76" cy="60" r="5" fill="#f59e0b" />
  <circle cx="94" cy="60" r="5" fill="#10b981" />
  <text x="120" y="64" fill="#cbd5e1" font-family="monospace" font-size="12">fullstack-bootcamp.js</text>

  <!-- Code Lines -->
  <rect x="58" y="96" width="62" height="10" rx="5" fill="#38bdf8" />
  <rect x="128" y="96" width="110" height="10" rx="5" fill="#e2e8f0" />
  <rect x="246" y="96" width="54" height="10" rx="5" fill="#34d399" />

  <rect x="76" y="122" width="90" height="10" rx="5" fill="#a78bfa" />
  <rect x="174" y="122" width="150" height="10" rx="5" fill="#94a3b8" />

  <rect x="76" y="148" width="120" height="10" rx="5" fill="#34d399" />
  <rect x="204" y="148" width="94" height="10" rx="5" fill="#fbbf24" />

  <rect x="76" y="174" width="76" height="10" rx="5" fill="#38bdf8" />
  <rect x="160" y="174" width="184" height="10" rx="5" fill="#e2e8f0" />

  <rect x="58" y="200" width="48" height="10" rx="5" fill="#38bdf8" />
  <rect x="114" y="200" width="136" height="10" rx="5" fill="#94a3b8" />

  <!-- Terminal Bar inside Editor -->
  <rect x="56" y="232" width="340" height="54" rx="8" fill="#1e293b" />
  <text x="72" y="254" fill="#34d399" font-family="monospace" font-size="12">$ npm run deploy --production</text>
  <text x="72" y="274" fill="#e2e8f0" font-family="monospace" font-size="12">Build berhasil — 12 Minggu Fullstack Siap!</text>

  <!-- Floating Preview Card -->
  <rect x="276" y="208" width="248" height="172" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <rect x="294" y="226" width="92" height="22" rx="11" fill="url(#accentGrad)" />
  <text x="308" y="241" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">12 MINGGU</text>

  <rect x="294" y="262" width="190" height="14" rx="7" fill="#0f172a" />
  <rect x="294" y="284" width="150" height="10" rx="5" fill="#64748b" />

  <!-- Mini Progress Bars -->
  <rect x="294" y="310" width="212" height="12" rx="6" fill="#e2e8f0" />
  <rect x="294" y="310" width="176" height="12" rx="6" fill="#1d4ed8" />

  <rect x="294" y="334" width="212" height="12" rx="6" fill="#e2e8f0" />
  <rect x="294" y="334" width="144" height="12" rx="6" fill="#0f766e" />

  <text x="294" y="366" fill="#475569" font-family="sans-serif" font-size="11" font-weight="600">HTML · CSS · JS · PHP · SQL · Git</text>
</svg>
